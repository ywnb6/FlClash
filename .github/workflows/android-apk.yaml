name: android-apk

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target ABI'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - armeabi-v7a
          - x86_64
      publish:
        description: 'Publish a release after the build (only once the APK is verified)'
        required: true
        default: false
        type: boolean
      notes:
        description: 'Release notes: the changes in this build, one line each (leave empty to use the last commit subject)'
        required: false
        default: ''
        type: string
  push:
    branches:
      - 'main'
    paths:
      - 'lib/store/**'
      - '.github/workflows/android-apk.yaml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Build ${{ github.event.inputs.arch || 'arm64' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n

      # The generated model code is never edited by hand, so the checkout is
      # brought in line with the annotations before anything compiles against it.
      - name: Generate model and provider code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      # The tag this run publishes is decided before packaging, so the version
      # inside the APK matches the release the update check compares against.
      - name: Decide the release version
        id: release_version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          base=$(echo "$version" | cut -d. -f1,2)
          patch=$(echo "$version" | cut -d. -f3)
          # Only published releases count, so the version always moves forward
          # from what the app can actually see.
          # The version comes from pubspec, so a release carries exactly the
          # number the build reports about itself.
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=$(date +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the build
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
          RELEASE_CODE: ${{ steps.release_version.outputs.code }}
        run: |
          set -euo pipefail
          sed -i "s/^version: .*/version: ${RELEASE_VERSION}+${RELEASE_CODE}/" pubspec.yaml
          grep -m1 '^version:' pubspec.yaml

      - name: Package APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ARCH_INPUT: ${{ github.event.inputs.arch || 'arm64' }}
        run: |
          dart tool/package.dart android --arch "$ARCH_INPUT" --env stable -v

      - name: Sign with a throwaway key when no release key exists
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          if [ -f android/app/keystore.jks ]; then
            echo 'release keystore present, packaged APKs are signed'
          else
            echo 'no release keystore; APK is signed by CI debug key'
            find dist -name '*.apk' -maxdepth 2 -print
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: flclash-apk-${{ github.event.inputs.arch || 'arm64' }}
          path: |
            dist/*.apk
            dist/manifest.json
            dist/*SHA256SUMS
          if-no-files-found: error
          overwrite: true

      - name: Publish release so the app can find this build
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH_INPUT: ${{ github.event.inputs.arch || 'arm64' }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          short=$(git rev-parse --short=7 HEAD)
          echo "publishing $tag from $short"
          if ! ls dist/*.apk >/dev/null 2>&1; then
            gh run download "$GITHUB_RUN_ID" -n "flclash-apk-${ARCH_INPUT}" -D dist
          fi
          apk=$(ls dist/*.apk | head -1)
          name="FlClash-${RELEASE_VERSION}-android-${ARCH_INPUT}.apk"
          cp "$apk" "/tmp/$name"
          sha256sum "/tmp/$name" | sed "s#/tmp/##" > "/tmp/FlClash-${RELEASE_VERSION}-SHA256SUMS"
          notes="${NOTES_INPUT:-}"
          if [ -z "$notes" ]; then
            notes=$(git log -1 --pretty=%s)
          fi
          printf '%s\n' "$notes" > /tmp/notes.md
          gh release create "$tag" \
            --title "FlClash 商店版 ${RELEASE_VERSION}" \
            --notes-file /tmp/notes.md \
            "/tmp/$name" "/tmp/FlClash-${RELEASE_VERSION}-SHA256SUMS"
          echo "released $tag"

      - name: Summary
        run: |
          {
            echo '## APK built'
            echo
            echo '| file | size |'
            echo '| --- | --- |'
            for f in dist/*.apk; do
              [ -e "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo 'Download it from the **Artifacts** section of this run.'
          } >> "$GITHUB_STEP_SUMMARY"
