name: android-apk

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target ABI'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - armeabi-v7a
          - x86_64
  push:
    branches:
      - 'main'
    paths:
      - 'lib/store/**'
      - '.github/workflows/android-apk.yaml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  build:
    name: Build ${{ github.event.inputs.arch || 'arm64' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: |
          flutter --version
          flutter pub get
          flutter gen-l10n

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Package APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ARCH_INPUT: ${{ github.event.inputs.arch || 'arm64' }}
        run: |
          dart tool/package.dart android --arch "$ARCH_INPUT" --env stable -v

      - name: Sign with a throwaway key when no release key exists
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          if [ -f android/app/keystore.jks ]; then
            echo 'release keystore present, packaged APKs are signed'
          else
            echo 'no release keystore; APK is signed by CI debug key'
            find dist -name '*.apk' -maxdepth 2 -print
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: flclash-apk-${{ github.event.inputs.arch || 'arm64' }}
          path: |
            dist/*.apk
            dist/manifest.json
            dist/*SHA256SUMS
          if-no-files-found: error
          overwrite: true

      - name: Publish release so the app can find this build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCH_INPUT: ${{ github.event.inputs.arch || 'arm64' }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          short=$(git rev-parse --short=7 HEAD)
          # Every build gets its own patch tag, so an installed build always sees
          # a higher version and offers the update.
          base=$(echo "$version" | cut -d. -f1,2)
          patch=$(echo "$version" | cut -d. -f3)
          existing=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E "^v${base}\." | sed "s/^v${base}\.//" | sort -n | tail -1)
          next=${existing:-$patch}
          if [ "$next" -gt "$patch" ]; then tag_version="${base}.$((next+1))"; else tag_version="${base}.$((patch+1))"; fi
          tag="v${tag_version}"
          echo "publishing $tag from $short"
          apk=$(ls dist/*.apk | head -1)
          name="FlClash-${tag_version}-android-${ARCH_INPUT}.apk"
          cp "$apk" "/tmp/$name"
          sha256sum "/tmp/$name" | sed "s#/tmp/##" > "/tmp/FlClash-${tag_version}-SHA256SUMS"
          gh release create "$tag" \
            --title "FlClash 商店版 ${tag_version}" \
            --notes "构建 ${short}"$'\n\n'"- 商店：登录 / 套餐 / 购买 / 链接导入"$'\n'"- 面板：易挽机场"$'\n'"- 局域网代理默认开启" \
            "/tmp/$name" "/tmp/FlClash-${tag_version}-SHA256SUMS"
          echo "released $tag"

      - name: Summary
        run: |
          {
            echo '## APK built'
            echo
            echo '| file | size |'
            echo '| --- | --- |'
            for f in dist/*.apk; do
              [ -e "$f" ] || continue
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo
            echo 'Download it from the **Artifacts** section of this run.'
          } >> "$GITHUB_STEP_SUMMARY"
